<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化选基 — V3.8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcfcfa;
    --surface:#ffffff;
    --surface-2:#f5f5f4;
    --line:#e7e5e4;
    --line-strong:#d6d3d1;
    --ink:#0c0a09;
    --muted:#57534e;
    --faint:#a8a29e;
    --accent:#0c0a09;
    --accent-soft:#f5f5f4;
    --success:#15803d;
    --success-soft:#f0fdf4;
    --danger:#be123c;
    --danger-soft:#fff1f2;
    --warn:#a16207;
    --radius:10px;
    --radius-lg:14px;
    --sans:"Inter", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    --serif:"Instrument Serif", Georgia, serif;
    --mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:#1c1917;color:#fff}
  ::placeholder{color:var(--faint)}
  a{color:inherit;text-underline-offset:3px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  @media(max-width:640px){.wrap{padding:0 16px}}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(252,252,250,.86);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
  .head{height:56px;display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:-.02em}
  .brand span{font:11px var(--mono);letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);padding:3px 7px;border-radius:999px}
  .head-status{margin-left:auto;display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.ok{background:var(--success);box-shadow:0 0 0 4px rgba(21,128,61,.12)}
  .dot.busy{background:var(--warn);box-shadow:0 0 0 4px rgba(161,98,7,.12);animation:pulse 1.6s ease-out infinite}
  .dot.err{background:var(--danger);box-shadow:0 0 0 4px rgba(190,18,60,.12)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* nav */
  .subnav{display:flex;gap:20px;overflow:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:32px}
  .subnav::-webkit-scrollbar{display:none}
  .subnav a{font:13px var(--sans);color:var(--muted);padding:14px 2px 12px;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
  .subnav a.active{color:var(--ink);border-color:var(--ink)}
  .subnav a:hover{color:var(--ink)}

  /* type */
  h2{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:-.02em;line-height:1.2;margin:0}
  h2 + p{margin-top:8px}
  .eyebrow{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}
  .mono{font-family:var(--mono)}
  .tabular{font-variant-numeric:tabular-nums}

  /* sections */
  section{padding:32px 0;border-bottom:1px solid var(--line)}
  section:last-of-type{border-bottom:none}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .section-head h2{flex:none}
  .hint{font:12px var(--sans);color:var(--faint);line-height:1.6}

  /* panels - flat, no nested cards */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px}
  @media(max-width:640px){.panel{padding:16px}}

  /* water */
  .water-grid{display:grid;grid-template-columns: 1.1fr .9fr;gap:24px;align-items:center}
  @media(max-width:860px){.water-grid{grid-template-columns:1fr}}
  .gauge{display:flex;align-items:center;gap:20px}
  .gauge-num{font-family:var(--serif);font-size:42px;line-height:1;letter-spacing:-.04em;min-width:92px}
  .gauge-num small{font:11px var(--mono);letter-spacing:.06em;color:var(--faint);display:block;margin-top:4px}
  .meter{flex:1}
  .track{height:4px;background:var(--surface-2);border-radius:999px;position:relative;overflow:hidden}
  .track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .track-ticks{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--faint);margin-top:6px}
  .regime{font:13px var(--sans);color:var(--muted);padding:10px 12px;background:var(--surface-2);border-radius:8px;border:1px solid var(--line)}
  .slots{margin-top:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
  .slots b{font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:-.02em}
  .slots span{font:12px var(--mono);color:var(--muted)}

  /* terrain */
  .terrain{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  @media(max-width:1024px){.terrain{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:640px){.terrain{grid-template-columns:repeat(2,1fr)}}
  .t{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
  .t-name{font:12px var(--sans);font-weight:500}
  .t-meta{font:11px var(--mono);color:var(--faint);margin-top:2px}
  .t-bar{height:3px;background:var(--surface-2);border-radius:999px;margin:10px 0 6px;overflow:hidden}
  .t-bar i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
  .t-pct{font:13px var(--mono);font-weight:500;letter-spacing:-.02em}
  .c-low{color:var(--success)} .c-mid{color:var(--warn)} .c-high{color:var(--danger)}
  .skeleton{height:86px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(100deg, var(--surface-2) 40%, #fff 50%, var(--surface-2) 60%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
  @keyframes shimmer{to{background-position:-200% 0}}

  /* forms */
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.form-row{grid-template-columns:1fr}}
  .field label{font:12px var(--sans);font-weight:500;color:var(--muted);display:block;margin-bottom:6px}
  .field input,.field textarea, .field select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px var(--mono);color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s}
  .field input:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(12,10,9,.08)}
  .field textarea{resize:vertical;min-height:132px;line-height:1.6}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .btn{appearance:none;border:1px solid transparent;border-radius:999px;padding:10px 18px;font:13px var(--sans);font-weight:500;cursor:pointer;transition:all .15s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn-primary:hover{background:#1c1917}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .status{margin-top:10px;display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--muted);min-height:16px;flex-wrap:wrap}
  .preview{margin-top:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12px var(--mono);color:var(--muted);line-height:1.7;white-space:pre-wrap}

  /* toolbar */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .toolbar input{flex:0 1 220px}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font:12px var(--sans);font-weight:500;cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}
  .count{margin-left:auto;font:12px var(--mono);color:var(--faint)}

  /* tables */
  .table-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:560px;background:var(--surface)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;z-index:2;background:var(--surface);font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
  thead th:first-child, tbody td:first-child{text-align:center}
  th:nth-child(2),th:nth-child(3),td:nth-child(2),td:nth-child(3){text-align:left}
  td{padding:10px 12px;text-align:right;border-bottom:1px solid #f5f5f4;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
  td.name{font-family:var(--sans);max-width:220px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover{background:#fafaf9}
  .score{font-family:var(--serif);font-size:14px;letter-spacing:-.02em}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font:11px var(--sans);font-weight:500;border:1px solid var(--line);white-space:nowrap}
  .b-green{background:var(--success-soft);color:var(--success);border-color:#bbf7d0}
  .b-amber{background:#fffbeb;color:var(--warn);border-color:#fde68a}
  .b-red{background:var(--danger-soft);color:var(--danger);border-color:#fecdd3}
  .b-blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
  .b-mute{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
  .pen{color:var(--danger);font:11px var(--sans);max-width:220px;overflow:hidden;text-overflow:ellipsis}

  /* waterfall */
  .wf{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  @media(max-width:860px){.wf{grid-template-columns:1fr}}
  .wf-title{font-family:var(--serif);font-size:18px;letter-spacing:-.02em}
  .wf-meta{font:12px var(--mono);color:var(--faint);margin-top:4px}
  .chips{margin-top:8px}
  .chips span{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin:3px 4px 0 0;font:11px var(--mono);color:var(--muted);background:var(--surface-2)}
  .fbar{margin:10px 0}
  .fbar label{font:12px var(--sans);color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px}
  .fbar label b{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .fbar .tr{height:4px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .fbar .tr i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
  .facts{font:12px var(--mono);color:var(--muted);line-height:1.8}
  .plist{margin-top:8px}
  .plist li{list-style:none;font:12px var(--sans);color:var(--danger);padding:3px 0}
  .plist li.ok{color:var(--success)}

  /* rebalance */
  .rb{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
  @media(max-width:980px){.rb{grid-template-columns:1fr}}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
  .kpi label{font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .kpi b{font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:-.02em;display:block;margin-top:2px}
  .kpi small{font:11px var(--mono);color:var(--muted)}
  .orders{display:grid;gap:8px}
  .order{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
  .order .side{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--line);flex:none}
  .order.sell .side{background:var(--danger-soft);color:var(--danger);border-color:#fecdd3}
  .order.buy .side{background:var(--success-soft);color:var(--success);border-color:#bbf7d0}
  .order .meta{flex:1;min-width:0}
  .order .meta b{font:13px var(--sans);font-weight:500}
  .order .meta div{font:12px var(--mono);color:var(--faint);margin-top:2px}
  .order .amt{font-family:var(--serif);font-size:15px;letter-spacing:-.02em;text-align:right}
  .order .amt small{font:11px var(--mono);color:var(--faint);display:block}
  .alloc-bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;display:flex;margin:8px 0 6px}
  .alloc-bar i{display:block;height:100%}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font:11px var(--mono);color:var(--faint)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend em{width:8px;height:8px;border-radius:999px;display:inline-block}
  .empty{padding:28px;text-align:center;font:13px var(--sans);color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface-2)}

  footer{padding:32px 0 24px;color:var(--faint);font:11px var(--mono);line-height:1.8;text-align:center;border-top:1px solid var(--line);margin-top:32px}
  .hide{display:none}
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div class="brand"><b>量化选基</b><span>V3.8</span></div>
    <div class="head-status"><span class="dot" id="hd-dot"></span><span id="hd-date">加载中…</span></div>
  </div>
</header>
<div class="wrap">
  <nav class="subnav">
    <a href="#sec-water" class="active">市场</a>
    <a href="#sec-scan">扫描</a>
    <a href="#sec-board">榜单</a>
    <a href="#sec-rebalance">持仓诊断</a>
    <a href="#sec-single">单基</a>
  </nav>

  <section id="sec-water">
    <div class="section-head">
      <h2>市场水位</h2>
      <span class="hint">6 风格等权 · 5年 PE 分位</span>
    </div>
    <div class="panel">
      <div class="water-grid">
        <div>
          <div class="gauge">
            <div class="gauge-num"><span id="water-num">—</span><small>估值分位</small></div>
            <div class="meter">
              <div class="track"><i id="water-bar"></i></div>
              <div class="track-ticks"><span>0</span><span>20</span><span>50</span><span>100</span></div>
            </div>
          </div>
          <div class="slots">
            <span class="faint">可建仓</span><b id="water-slots">— / 10 槽</b><span id="water-slots-sub" class="mono faint"></span>
          </div>
        </div>
        <div>
          <div class="regime" id="regime">—</div>
          <div class="hint" id="reversal" style="margin-top:10px"></div>
        </div>
      </div>
    </div>
    <div class="terrain" id="terrain" style="margin-top:12px">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </section>

  <section id="sec-strategy">
    <div class="section-head">
      <h2>执行纪律</h2>
      <span class="hint">S&gt;70 / S&lt;45 · 10 槽等权</span>
    </div>
    <div class="panel" id="strategy-card" style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div>
        <div class="eyebrow">信号</div>
        <div id="st-signal" style="margin-top:8px;font:13px var(--sans);line-height:1.8;color:var(--muted)">加载中…</div>
      </div>
      <div>
        <div class="eyebrow">风控</div>
        <div id="st-risk" style="margin-top:8px;font:13px var(--sans);line-height:1.8;color:var(--muted)">加载中…</div>
      </div>
      <div style="grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line);font:12px var(--mono);color:var(--muted)">
        <span id="st-crisis">加载中…</span><span style="margin-left:auto" id="st-cppi"></span>
      </div>
      <div id="st-decision" style="grid-column:1/-1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font:13px var(--sans)" class="hide"></div>
    </div>
  </section>

  <section id="sec-scan">
    <div class="section-head">
      <h2>全市场扫描</h2>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="loadResults()">加载最近榜单</button>
    </div>
    <div class="panel">
      <div class="form-row" style="align-items:end">
        <div class="field"><label>右侧池</label><input class="mono" id="in-right" type="number" value="400"></div>
        <div class="field"><label>左侧池</label><input class="mono" id="in-left" type="number" value="150"></div>
        <div style="display:flex;gap:8px"><button class="btn btn-primary" id="btn-scan" onclick="startScan()">开始扫描</button></div>
      </div>
      <div class="track" style="margin-top:14px;height:4px"><i id="pg" style="background:var(--ink)"></i></div>
      <div class="status"><span class="dot" id="st-dot"></span><span id="st">空闲</span></div>
    </div>
  </section>

  <section id="sec-board">
    <div class="section-head">
      <h2>榜单</h2>
      <span class="hint">点击行查看穿透</span>
    </div>
    <div class="panel" style="padding:0;overflow:hidden">
      <div style="padding:12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input id="kw" placeholder="搜索 代码 / 名称" oninput="renderBoard()" style="flex:1;min-width:180px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:13px var(--sans);outline:none">
        <div class="seg" id="flt-seg">
          <button data-f="all" class="on" onclick="setFlt('all')">全部</button>
          <button data-f="green" onclick="setFlt('green')">≥70</button>
          <button data-f="yellow" onclick="setFlt('yellow')">50–70</button>
          <button data-f="veto" onclick="setFlt('veto')">否决</button>
        </div>
        <span class="count mono" id="bd-n"></span>
      </div>
      <div class="table-wrap" style="border:none;border-radius:0">
        <table id="board"><thead><tr>
          <th>#</th><th>代码</th><th>名称</th>
          <th data-k="S_total" onclick="sortBy('S_total')">总分</th>
          <th>评级</th><th>信号</th>
          <th data-k="F_value" onclick="sortBy('F_value')">估值</th>
          <th data-k="F_alpha" onclick="sortBy('F_alpha')">Alpha</th>
          <th data-k="F_momentum" onclick="sortBy('F_momentum')">动量</th>
          <th data-k="val_pct" onclick="sortBy('val_pct')">分位</th>
          <th>风控</th><th></th>
        </tr></thead><tbody></tbody></table>
      </div>
      <div class="empty" id="bd-empty" style="margin:12px">暂无榜单，先执行扫描</div>
    </div>
  </section>

  <section id="sec-rebalance">
    <div class="section-head">
      <h2>持仓诊断</h2>
      <span class="hint">输入代码与金额，按策略生成操作</span>
    </div>
    <div class="rb">
      <div class="panel">
        <div class="form-row">
          <div class="field"><label>总资金</label><input id="rb-total" class="mono" placeholder="100000 或 10万"></div>
          <div class="field"><label>可用现金</label><input id="rb-cash" class="mono" placeholder="20000"></div>
        </div>
        <div class="field" style="margin-top:12px"><label>持仓 · 每行 代码 金额</label><textarea id="rb-holdings" placeholder="110011 2.5万
161725 18000
003096 1.2万"></textarea></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="rbFillExample()">示例</button>
          <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="rbFromBoardTop()">榜单前5</button>
          <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="rbClear()">清空</button>
          <span class="hint" style="margin-left:auto"><span id="rb-count" class="mono">0</span> 只 · <span id="rb-sum" class="mono">—</span></span>
        </div>
        <div class="preview mono" id="rb-preview">等待输入…</div>
        <div class="actions">

<script>
let ROWS=[], sortKey='S_total', sortDir=-1, flt='all', poll=null;
const G={
  dot:'<svg viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="4"/></svg>',
  bolt:'<svg viewBox="0 0 10 10" fill="currentColor"><path d="M5.8 0 2 5.6h2.5L3.6 10 8.4 3.8H5.7L7.4 0z"/></svg>',
  dia:'<svg viewBox="0 0 10 10" fill="currentColor"><path d="M5 0l4 5-4 5-4-5z"/></svg>',
  veto:'<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="5" r="3.6"/><path d="M2.5 2.5l5 5"/></svg>',
  ring:'<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="5" r="3.4"/></svg>'};
function setStatus(a,b,k,t){const d=document.getElementById(a);if(d)d.className='dot '+(k||'');const e=document.getElementById(b);if(e)e.textContent=t}
function fmtYuan(n){if(n==null||isNaN(n))return '—';n=Number(n);if(Math.abs(n)>=10000)return (n/10000).toFixed(n%10000===0?0:2)+'万';return n.toLocaleString('zh-CN')}
function fmtYuanFull(n){if(n==null||isNaN(n))return '—';return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0})+' 元'}
function parseYuan(s){if(s==null||s==='')return 0;if(typeof s==='number')return s;let t=String(s).trim().replace(/,/g,'').replace(/，/g,'').replace(/\\s+/g,'');if(!t)return 0;let m=1;const low=t.toLowerCase();if(low.endsWith('万元')||low.endsWith('万')){t=t.replace(/万元?$/,'').replace(/万$/,'');m=10000}else if(low.endsWith('w')){t=t.slice(0,-1);m=10000}else if(low.endsWith('k')){t=t.slice(0,-1);m=1000}t=t.replace(/[¥￥元]/g,'');const v=parseFloat(t);return isNaN(v)?0:v*m}

async function loadStrategyState(){
  try{
    const j=await (await fetch('/api/strategy_state')).json();
    const sg=j.signal||{}, cs=j.crisis||{}, csh=j.cash||{}, mr=j.micro_risk||{}, dc=j.decision||{};
    document.getElementById('st-signal').innerHTML=`S&gt;${sg.buy_th} 买 · S&lt;${sg.sell_th} 卖 · ${sg.slots} 槽`;
    document.getElementById('st-risk').innerHTML=`现金 ${(csh.annual_yield*100).toFixed(1)}% · 止损 ${(mr.trail_stop*100).toFixed(0)}%`;
    document.getElementById('st-crisis').textContent=cs.active?`危机 · ${cs.reason}`: (cs.data_insufficient?'数据不足':'正常');
    document.getElementById('st-crisis').style.color=cs.active?'var(--danger)':'var(--muted)';
    document.getElementById('st-cppi').textContent=(j.cppi?.rules||[]).map(r=>`≤${(r.drawdown_lte*100).toFixed(0)}%→${r.max_slots===0?'清仓':r.max_slots+'槽'}`).join(' · ');
    const ws=document.getElementById('water-slots'), wss=document.getElementById('water-slots-sub');
    if(ws){const max=dc.max_slots_by_macro ?? sg.slots; const isC=cs.active; ws.textContent=`${max} / ${sg.slots}`; ws.style.color=isC?'var(--danger)':'var(--ink)'; if(wss) wss.textContent=isC?'禁新开仓':'可建仓';}
    const dec=document.getElementById('st-decision');
    if(dec){ if(dc.new_buy_allowed){dec.className='';dec.style.cssText='grid-column:1/-1;padding:10px 12px;border-radius:8px;border:1px solid #bbf7d0;background:var(--success-soft);color:var(--success);font:12px var(--mono)';dec.textContent=`可建仓 · 最多 ${dc.max_slots_by_macro} 槽`} else {dec.className='';dec.style.cssText='grid-column:1/-1;padding:10px 12px;border-radius:8px;border:1px solid #fecdd3;background:var(--danger-soft);color:var(--danger);font:12px var(--mono)';dec.textContent=dc.message; dec.classList.remove('hide')} }
  }catch(e){}
}
async function loadTerrain(){
  const box=document.getElementById('terrain');
  try{
    const j=await (await fetch('/api/terrain')).json();
    box.innerHTML=j.items.map(x=>{
      if(x.error) return `<div class="t"><div class="t-name">${x.name}</div><div class="t-meta">${x.error}</div></div>`;
      const p=x.pct??50, cls=p<=30?'c-low':(p<=70?'c-mid':'c-high'), c=p<=30?'var(--success)':(p<=70?'var(--warn)':'var(--danger)');
      return `<div class="t"><div class="t-name">${x.name}</div><div class="t-meta">PE ${x.pe} · ${x.date}</div><div class="t-bar"><i style="width:${p}%;background:${c}"></i></div><div class="t-pct ${cls}">${p}%</div></div>`;
    }).join('');
    if(j.asof){
      document.getElementById('hd-date').textContent=`${j.asof} · ${j.water!=null? j.water+'%':''}`;
      document.getElementById('hd-dot').className='dot '+(j.asof<j.asof_expected?'err':'ok');
    }
    const w=j.water; if(w!=null){const wc=w<=20?'var(--success)':(w>=90?'var(--danger)':(w>=70?'var(--warn)':'var(--ink)')); document.getElementById('water-num').innerHTML=`<span style="color:${wc}">${w}</span>`; const b=document.getElementById('water-bar'); requestAnimationFrame(()=>{b.style.width=w+'%';b.style.background=wc}); document.getElementById('regime').textContent=j.regime||'—';}
    if(j.reversal&&!j.reversal.error){const r=j.reversal; document.getElementById('reversal').innerHTML=`MA20 ${r.above_ma20?'之上':'之下'} · 量比 ${r.vol_ratio??'—'}${r.reversal?' · 放量反转':''}`;}
  }catch(e){box.innerHTML='<div class="empty">加载失败</div>';}
}
async function startScan(){
  const r=+document.getElementById('in-right').value, l=+document.getElementById('in-left').value;
  const res=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({right:r,left:l})}); const j=await res.json(); if(!j.ok){setStatus('st-dot','st','err',j.message);return}
  document.getElementById('btn-scan').disabled=true; setStatus('st-dot','st','busy','启动…'); startPoll();
}
function startPoll(){ if(poll) clearInterval(poll); poll=setInterval(async()=>{const s=await (await fetch('/api/scan/status')).json(); const tot=s.total||0,done=s.done||0; document.getElementById('pg').style.width=tot?Math.round(done/tot*100)+'%':(s.phase==='done'?'100%':'6%'); if(s.phase==='universe') setStatus('st-dot','st','busy',s.message); else if(s.phase==='scoring') setStatus('st-dot','st','busy',`${done}/${tot} · ${s.elapsed}s`); else if(s.phase==='done'){setStatus('st-dot','st','ok',s.message);clearInterval(poll);document.getElementById('btn-scan').disabled=false;loadResults()} else if(s.phase==='error'){setStatus('st-dot','st','err',s.message);clearInterval(poll);document.getElementById('btn-scan').disabled=false}},1500)}
function poolPct(r,a){return a.length? a.filter(x=>x.S_total<=r.S_total).length/a.length:0}
function sigOf(r){const ps=String(r.penalty_str||''); const veto=/-100%/.test(ps)||((r.penalties||[]).some(p=>p[1]>=1)); if(veto) return `<span class="badge b-red">否决</span>`; if(r.channel==='新星') return r.S_total>=50?`<span class="badge b-blue">观察</span>`:`<span class="badge b-mute">—</span>`; if((r.rating||'').includes('封顶')) return `<span class="badge b-green">Buy·帽</span>`; if(r.S_total>=70) return `<span class="badge b-green">买入</span>`; if(r.S_total<45) return `<span class="badge b-red">卖出</span>`; if(r.S_total>=50) return `<span class="badge b-amber">持有</span>`; return `<span class="badge b-mute">回避</span>`}
async function loadResults(){const j=await (await fetch('/api/results')).json(); ROWS=j.rows||[]; const M=ROWS.filter(r=>r.channel!=='新星'); ROWS.forEach(r=>r.pool_pct=poolPct(r,M)); document.getElementById('bd-empty').style.display=ROWS.length?'none':''; document.getElementById('bd-n').textContent=ROWS.length?`${j.n} · ${j.stamp} · ${j.asof||''}`:''; renderBoard()}
function setFlt(f){flt=f; document.querySelectorAll('#flt-seg button').forEach(b=>b.classList.toggle('on',b.dataset.f===f)); renderBoard()}
function sortBy(k){if(sortKey===k) sortDir*=-1; else{sortKey=k;sortDir=-1} renderBoard()}
function ratingCell(r){const rt=String(r.rating||''); if(rt.includes('🌱')) return `<span class="badge b-blue">观察</span>`; if(rt.includes('封顶')) return `<span class="badge b-green">Buy·帽</span>`; if(r.S_total>=85) return `<span class="badge b-green">StrongBuy</span>`; if(r.S_total>=70) return `<span class="badge b-green">Buy</span>`; if(r.S_total>=50) return `<span class="badge b-amber">Hold</span>`; return `<span class="badge b-red">Sell</span>`}
function renderBoard(){
  const kw=(document.getElementById('kw').value||'').trim();
  let v=ROWS.filter(r=>{
    if(kw&&!(r.name.includes(kw)||String(r.code).includes(kw)))return false;
    if(flt==='green'&&!(r.S_total>=70))return false;
    if(flt==='yellow'&&!(r.S_total>=50&&r.S_total<70))return false;
    if(flt==='veto'&&!/-100%/.test(String(r.penalty_str||'')))return false;
    return true;
  }); v.sort((a,b)=>((b[sortKey]??-999)-(a[sortKey]??-999))*(sortDir===1?-1:1)*-1); v=v.slice(0,300);
  document.querySelector('#board tbody').innerHTML=v.map((r,i)=>`<tr onclick="queryFund('${r.code}')" style="cursor:pointer">
    <td>${i+1}</td><td>${r.code}</td><td class="name">${r.name}</td>
    <td class="score">${r.S_total}</td><td>${ratingCell(r)}</td><td>${sigOf(r)}</td>
    <td>${r.F_value??''}</td><td>${r.F_alpha??''}</td><td>${r.F_momentum??''}</td>
    <td>${r.val_pct!=null?(r.val_pct*100).toFixed(0)+'%':''}</td>
    <td class="pen">${r.penalty_str||''}</td><td><button class="btn btn-ghost" style="padding:4px 8px;font-size:11px" onclick="event.stopPropagation();addToRebalance('${r.code}')">加入</button></td></tr>`).join('');
}
async function queryFund(code){
  code=(code||'').trim(); if(!code) return;
  setStatus('q-dot','qst','busy','拉取…'); document.getElementById('wf').innerHTML='';
  try{const j=await (await fetch('/api/fund/'+code.padStart(6,'0'),{method:'POST'})).json(); if(!j.ok){setStatus('q-dot','qst','err',j.message);return} setStatus('q-dot','qst','ok',j.fund.last_date); renderWaterfall(j.fund,'wf')}catch(e){setStatus('q-dot','qst','err','失败')}
}
function bar(l,v,c){v=v??0; return `<div class="fbar"><label><span>${l}</span><b>${(+v).toFixed(1)}</b></label><div class="tr"><i style="width:${v}%;background:${c}"></i></div></div>`}
function renderWaterfall(f,mount){
  if(f.pool_pct==null&&ROWS.length) f.pool_pct=ROWS.filter(x=>x.S_total<=f.S_total).length/ROWS.length;
  const we=Object.entries(f.rbsa||{}).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0.03).map(x=>`<span>${x[0]} ${(x[1]*100).toFixed(0)}%</span>`).join('');
  const pens=(f.penalties&&f.penalties.length)? f.penalties.map(p=>`<li><span>×</span>${p[0]} ${p[1]}</li>`).join('') : '<li class="ok">无风控</li>';
  const pd=f.penalty_detail||{};
  const scoreBadge=f.S_total!=null? `<span class="badge ${f.S_total>=70?'b-green':(f.S_total>=50?'b-amber':'b-red')}" style="font-size:13px;padding:5px 10px">总分 ${f.S_total}</span>` : `<span class="badge b-mute">总分 —</span>`;
  document.getElementById(mount).innerHTML=`<div class="wf">
    <div><div class="wf-title">${f.code} ${f.name}</div><div style="display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap">${scoreBadge}${sigOf(f)}${ratingCell(f)}</div><div class="wf-meta">${f.ftype} · ${f.is_passive?'被动':'主动'} · ${f.panel_mode==='overseas'?'境外面板':'A股面板'} · 数据 ${f.last_date}</div>
      ${bar('F_value',f.F_value,'#15803d')}${bar('F_alpha',f.F_alpha,'#1d4ed8')}${bar('F_momentum',f.F_momentum,'#a16207')}
      <div class="facts">分位 ${f.val_pct!=null?(f.val_pct*100).toFixed(1)+'%':'—'} · 趋势 ${f.trend_ok?'是':'否'} · IR ${f.ir_winrate!=null?(f.ir_winrate*100).toFixed(0)+'%':'—'} · 下行捕获 ${f.down_capture??'—'}</div>
    </div><div><div class="eyebrow">穿透</div><div class="chips">${we||'<span style="color:var(--faint)">—</span>'}</div><div class="eyebrow" style="margin-top:12px">风控</div><ul class="plist">${pens}</ul><div class="facts">R_MDD ${pd.R_MDD??'—'}（回撤 ${pd.mdd_fund??'—'}/${pd.mdd_bench??'—'}） · 任职 ${f.tenure_days?Math.round(f.tenure_days/365)+'年':'—'} · 规模 ${f.scale??'—'}亿</div></div></div>`;
}
let WROWS=[], WD_OPEN=[];
async function runWatch(){
  const codes=document.getElementById('watch').value.split(/[\s,，、]+/).filter(Boolean); if(!codes.length) return;
  const CH=6,chunks=[]; for(let i=0;i<codes.length;i+=CH) chunks.push(codes.slice(i,i+CH));
  WROWS=[]; WD_OPEN=[];
  for(let ci=0;ci<chunks.length;ci++){
    setStatus('w-dot','wst','busy',`${ci+1}/${chunks.length}`);
    try{const j=await (await fetch('/api/watchlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codes:chunks[ci]})})).json(); if(j.ok) WROWS=WROWS.concat(j.rows||[])}catch(e){chunks[ci].forEach(c=>WROWS.push({code:c,error:'失败'}))}
  }
  WROWS.forEach(r=>r.pool_pct=poolPct(r,WROWS)); WD_OPEN=WROWS.map(()=>WROWS.length<=6);
  renderWatch();
}
function renderWatch(){
  const html=WROWS.map((r,i)=>{
    if(r.error) return `<tr><td>${r.code}</td><td colspan="6" style="color:var(--danger);text-align:left">${r.error}</td></tr>`;
    const open=WD_OPEN[i]?'':'hide';
    return `<tr onclick="toggleWd(${i})" style="cursor:pointer"><td>${r.code}</td><td class="name">${r.name}</td><td class="score">${r.S_total}</td><td>${ratingCell(r)}</td><td>${sigOf(r)}</td><td>${r.F_value??''}</td><td>${r.F_alpha??''}</td></tr><tr class="hide" id="wd-${i}"><td colspan="7"><div id="wfm-${i}"></div></td></tr>`;
  }).join('');
  document.getElementById('wout').innerHTML=`<div class="table-wrap"><table><thead><tr><th>代码</th><th>名称</th><th>总分</th><th>评级</th><th>信号</th><th>估值</th><th>Alpha</th></tr></thead><tbody>${html}</tbody></table></div>`;
  WROWS.forEach((r,i)=>{if(WD_OPEN[i]&&!r.error) renderWaterfall(r,'wfm-'+i)})
}
function toggleWd(i){ WD_OPEN[i]=!WD_OPEN[i]; document.getElementById('wd-'+i)?.classList.toggle('hide',!WD_OPEN[i]); if(WD_OPEN[i]) renderWaterfall(WROWS[i],'wfm-'+i)}
function watchToRebalance(){const c=document.getElementById('watch').value.trim(); if(!c) return; document.getElementById('rb-holdings').value=c.split(/[\s,，、]+/).filter(Boolean).map(x=>x.padStart(6,'0')+' 1万').join('\n'); document.getElementById('sec-rebalance').scrollIntoView({behavior:'smooth'}); updateRbPreview()}

// rebalance
function parseHoldingsText(t){const out=[]; for(const line of String(t||'').split(/[\n;；]+/)){const tr=line.trim(); if(!tr) continue; for(const seg of tr.split(/[,，]+/).map(s=>s.trim()).filter(Boolean)){const p=seg.split(/[\s:：]+/).filter(Boolean); const c=(p[0]||'').replace(/[^0-9]/g,'').padStart(6,'0'); if(!/^\d{6}$/.test(c)) continue; const v=p.length>1?parseYuan(p.slice(1).join(' ')):null; out.push({code:c,amount:v}); if(out.length>=50) break}} return out}
function updateRbPreview(){
  const t=document.getElementById('rb-holdings').value, total=parseYuan(document.getElementById('rb-total').value), cash=parseYuan(document.getElementById('rb-cash').value);
  const h=parseHoldingsText(t), n=h.length, sum=h.reduce((s,x)=>s+(x.amount||0),0);
  document.getElementById('rb-count').textContent=n; document.getElementById('rb-sum').textContent=sum?fmtYuanFull(sum):'—';
  const msg=n? `${n}只 · ${fmtYuanFull(sum)}` : '等待输入';
  document.getElementById('rb-preview').textContent=msg;
}
['rb-total','rb-cash','rb-holdings'].forEach(id=>document.getElementById(id)?.addEventListener('input',updateRbPreview));
function rbFillExample(){document.getElementById('rb-total').value='100000';document.getElementById('rb-cash').value='20000';document.getElementById('rb-holdings').value='110011 2.5万\n161725 1.8万\n003096 1.2万';updateRbPreview()}
function rbFromBoardTop(){if(!ROWS.length) return; const top=ROWS.filter(r=>r.S_total>=70).slice(0,5).map(r=>r.code+' 1万'); document.getElementById('rb-holdings').value=top.join('\n'); updateRbPreview()}
function rbClear(){document.getElementById('rb-holdings').value=''; updateRbPreview(); document.getElementById('rb-out').innerHTML='';}
function addToRebalance(c){c=String(c).padStart(6,'0'); const ta=document.getElementById('rb-holdings'); const cur=ta.value.trim(); if(parseHoldingsText(cur).some(x=>x.code===c)) return; ta.value=(cur?cur+'\n':'')+c+' 1万'; updateRbPreview(); document.getElementById('sec-rebalance').scrollIntoView({behavior:'smooth'})}
function rbSave(){localStorage.setItem('rb_data',JSON.stringify({total:document.getElementById('rb-total').value,cash:document.getElementById('rb-cash').value,holdings:document.getElementById('rb-holdings').value})); setStatus('rb-dot','rb-st','ok','已记忆')}
function rbLoad(){try{const d=JSON.parse(localStorage.getItem('rb_data')||'null'); if(!d) return; document.getElementById('rb-total').value=d.total||'';document.getElementById('rb-cash').value=d.cash||'';document.getElementById('rb-holdings').value=d.holdings||'';updateRbPreview()}catch(e){}}
async function runRebalance(){
  const holdings=parseHoldingsText(document.getElementById('rb-holdings').value.trim());
  if(!holdings.length) return;
  const total=parseYuan(document.getElementById('rb-total').value), cash=parseYuan(document.getElementById('rb-cash').value);
  document.getElementById('rb-btn').disabled=true; setStatus('rb-dot','rb-st','busy','计算中…');
  document.getElementById('rb-out').innerHTML='<div class="empty">计算中…</div>';
  try{
    const r=await fetch('/api/rebalance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({total_capital:total||0,cash:cash||0,holdings})});
    const j=await r.json(); if(!j.ok){setStatus('rb-dot','rb-st','err',j.message); document.getElementById('rb-out').innerHTML=`<div class="empty" style="color:var(--danger)">${j.message}</div>`; return}
    setStatus('rb-dot','rb-st','ok','完成'); renderRebalance(j);
  }catch(e){setStatus('rb-dot','rb-st','err','网络错误')}finally{document.getElementById('rb-btn').disabled=false}
}
function renderRebalance(j){
  const s=j.summary||{}, holdings=j.holdings||[], orders=j.orders||[], alloc=j.allocation||[];
  const totalCap=s.total_capital||0, perSlot=s.per_slot||0;
  const kpis=`<div class="kpis">
    <div class="kpi"><label>总资金</label><b>${fmtYuanFull(totalCap)}</b><small>每槽 ${fmtYuanFull(perSlot)}</small></div>
    <div class="kpi"><label>持仓 / 现金</label><b>${fmtYuan(s.holdings_value_before)}</b><small>/ ${fmtYuan(s.cash_before)}</small></div>
    <div class="kpi"><label>操作</label><b>${s.num_sells? s.num_sells+' 卖出':'—'}</b><small>保留 ${s.num_keeps||0}</small></div>
    <div class="kpi"><label>现金余额</label><b>${fmtYuan(s.cash_after)}</b><small>${s.cash_pct_after||0}%</small></div>
  </div>`;
  const nRetry=holdings.filter(h=>h.is_error && h.retryable!==false).length;
  const errBanner=nErr? `<div style="margin-top:12px;padding:10px 12px;border:1px solid #fde68a;background:#fffbeb;border-radius:8px;font:12px var(--mono);display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>${nErr} 只待复核${nRetry? ` · ${nRetry} 只可重试`:``}</span>${nRetry? `<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="retryFailedHoldings()">重试可重试项</button>`:``}<span style="color:var(--faint)">新基历史不足无需重试</span></div>`:'';
  const hRows=holdings.map(h=>{
    if(h.is_error){
      const canRetry=h.retryable!==false;
      return `<tr style="background:${canRetry?'#fffbeb':'#f5f5f4'}"><td>${h.code}</td><td class="name">${h.name}</td><td style="text-align:right">${fmtYuanFull(h.amount)}</td><td>—</td><td><span class="badge ${canRetry?'b-amber':'b-mute'}">${canRetry?'待重试':'观察仓'}</span></td><td><span class="badge b-mute">—</span></td><td style="max-width:260px;white-space:normal;font:12px var(--sans);color:var(--muted)">${h.error||''}</td><td>${canRetry?`<button class="btn btn-ghost" style="padding:4px 8px;font-size:11px" onclick="retryRebalanceSingle('${h.code}')">重试</button>`:`<span class="mono faint">—</span>`}</td></tr>`;
    }
    const act=h.action==='sell'?'卖出':'持有';
    return `<tr><td>${h.code}</td><td class="name">${h.name}</td><td style="text-align:right">${fmtYuanFull(h.amount)}</td><td class="score">${h.S_total??'—'}</td><td>${ratingCell(h)}</td><td>${sigOf(h)}</td><td>${h.action_label||act}</td><td style="text-align:right">${fmtYuanFull(h.target_amount)}</td></tr>`;
  }).join('');
  const hTable=`<div style="margin-top:14px"><div class="table-wrap"><table><thead><tr><th>代码</th><th>名称</th><th>金额</th><th>总分</th><th>评级</th><th>信号</th><th>操作</th><th>目标</th></tr></thead><tbody>${hRows}</tbody></table></div></div>`;
  const orderHtml=orders.length? `<div style="margin-top:14px"><div class="orders">${orders.map(o=>`<div class="order ${o.side==='SELL'?'sell':'buy'}"><span class="side">${o.side==='SELL'?'卖出':'买入'}</span><div class="meta"><b>${o.code} ${o.name}</b><div>${o.reason||''}</div></div><div class="amt">${fmtYuanFull(o.amount)}</div></div>`).join('')}</div><div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="copyOrders()">复制</button><button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="downloadOrders()">导出</button></div></div>`:`<div class="empty" style="margin-top:12px">${j.scan_msg||'无操作'}</div>`;
  const allocHtml=alloc.length? `<div style="margin-top:14px"><div class="alloc-bar">${alloc.map((a,i)=>`<i style="width:${a.pct}%;background:${['#0c0a09','#57534e','#a8a29e','#d6d3d1','#e7e5e4'][i%5]}"></i>`).join('')}<i style="width:${s.cash_pct_after||0}%;background:var(--surface-2);border:1px dashed var(--line)"></i></div><div class="legend">${alloc.map((a,i)=>`<span><em style="background:${['#0c0a09','#57534e','#a8a29e'][i%3]}"></em>${a.code} ${a.pct}%</span>`).join('')}<span><em style="background:var(--surface-2);border:1px solid var(--line)"></em>现金 ${s.cash_pct_after||0}%</span></div></div>`:'';
  document.getElementById('rb-out').innerHTML=kpis+errBanner+hTable+orderHtml+allocHtml;
  window._lastRebalance=j;
}
function copyOrders(){const j=window._lastRebalance; if(!j) return; const t=(j.orders||[]).map(o=>`${o.side} ${o.code} ${o.amount}`).join('\n'); navigator.clipboard.writeText(t).then(()=>setStatus('rb-dot','rb-st','ok','已复制'))}
function downloadOrders(){const j=window._lastRebalance; if(!j) return; const rows=[['side','code','amount']].concat((j.orders||[]).map(o=>[o.side,o.code,o.amount])); const csv=rows.map(r=>r.join(',')).join('\n'); const b=new Blob(["\uFEFF"+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='orders.csv'; a.click()}
async function retryRebalanceSingle(code){
  try{const j=await (await fetch('/api/fund/'+String(code).padStart(6,'0'),{method:'POST'})).json(); if(!j.ok) return; const last=window._lastRebalance; if(!last) return; const i=last.holdings.findIndex(h=>h.code===code); if(i>=0){const f=j.fund; last.holdings[i]={...last.holdings[i], name:f.name, S_total:f.S_total, rating:f.rating, is_error:false, error:null, action:f.S_total<45?'sell':'hold', action_label:f.S_total<45?'卖出':'持有'}; renderRebalance(last)}}catch(e){}
}
async function retryFailedHoldings(){const last=window._lastRebalance; if(!last) return; const list=last.holdings.filter(x=>x.is_error && x.retryable!==false); if(!list.length){alert("无可重试项（新基历史不足无需重试）");return} for(const h of list){await retryRebalanceSingle(h.code); await new Promise(r=>setTimeout(r,600))}}

updateRbPreview();
loadStrategyState(); loadTerrain(); loadResults();
</script>
